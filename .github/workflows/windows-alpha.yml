name: Windows Alpha

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  GODOT_VERSION: 4.6.3
  BUILD_VERSION: v0.1.0-alpha.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and Windows export template
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable"
          prefix="Godot_v${GODOT_VERSION}-stable"
          curl -fsSL --retry 3 "$base&slug=linux.x86_64.zip&platform=linux" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/${prefix}_linux.x86_64"
          ln -s "$RUNNER_TEMP/godot/${prefix}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl -fsSL --retry 3 "$base&slug=export_templates.tpz&platform=templates" -o "$RUNNER_TEMP/templates.tpz"
          templates="${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -j "$RUNNER_TEMP/templates.tpz" 'templates/windows_release_x86_64.exe' -d "$templates"
      - name: Import project and test match rules
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --editor --import 2>&1 | tee "$RUNNER_TEMP/import.log"
          timeout 45s godot --headless --script res://tests/match_test.gd 2>&1 | tee "$RUNNER_TEMP/rules.log"
          timeout 45s godot --headless -- --smoke 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -Eq 'TOUCHLINE_RULES: [1-9][0-9]* checks, 0 failures' "$RUNNER_TEMP/rules.log"
          grep -q TOUCHLINE_SMOKE_OK "$RUNNER_TEMP/smoke.log"
          if grep -E '(^| )ERROR:' "$RUNNER_TEMP/"{import,rules,smoke}.log; then exit 1; fi
      - name: Export Windows x64
        run: |
          mkdir -p "$RUNNER_TEMP/Touchline5"
          godot --headless --export-release "Windows Desktop" "$RUNNER_TEMP/Touchline5/Touchline5.exe"
          test -s "$RUNNER_TEMP/Touchline5/Touchline5.exe"
          test -s "$RUNNER_TEMP/Touchline5/Touchline5.pck"
          cp README.md "$RUNNER_TEMP/Touchline5/Spielanleitung.md"
          notices="https://raw.githubusercontent.com/godotengine/godot/${GODOT_VERSION}-stable"
          curl -fsSL --retry 3 "$notices/LICENSE.txt" -o "$RUNNER_TEMP/Touchline5/GODOT_LICENSE.txt"
          curl -fsSL --retry 3 "$notices/COPYRIGHT.txt" -o "$RUNNER_TEMP/Touchline5/GODOT_COPYRIGHT.txt"
          cd "$RUNNER_TEMP"
          zip -q -r "Touchline5-$BUILD_VERSION-Windows.zip" Touchline5
      - uses: actions/upload-artifact@v4
        with:
          name: windows-alpha
          path: ${{ runner.temp }}/Touchline5-${{ env.BUILD_VERSION }}-Windows.zip
          if-no-files-found: error

  windows-smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-alpha
      - name: Start the exported Windows executable
        shell: pwsh
        run: |
          Expand-Archive -Path "Touchline5-$env:BUILD_VERSION-Windows.zip" -DestinationPath game
          $binary = (Resolve-Path "game/Touchline5/Touchline5.exe").Path
          $log = Join-Path $env:RUNNER_TEMP "touchline-smoke.log"
          $process = Start-Process $binary -WorkingDirectory (Split-Path $binary) -ArgumentList @('--headless','--log-file',"`"$log`"",'--','--smoke') -PassThru -WindowStyle Hidden
          if (!$process.WaitForExit(60000)) {
            $process.Kill()
            throw "Windows smoke test timed out."
          }
          if (Test-Path $log) { Get-Content $log }
          if ($process.ExitCode -ne 0) { throw "Game exited with code $($process.ExitCode)." }
          if (!(Test-Path $log) -or !(Select-String -Path $log -Pattern 'TOUCHLINE_SMOKE_OK' -Quiet)) {
            throw "Game did not reach the match screen."
          }
          if (Select-String -Path $log -Pattern '(^| )ERROR:' -Quiet) {
            throw "The game reported runtime errors."
          }

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-alpha
      - name: Publish the verified pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$BUILD_VERSION" >/dev/null 2>&1; then
            gh release view "$BUILD_VERSION" --json isPrerelease,assets \
              --jq '.isPrerelease and any(.assets[]; .name == "Touchline5-'"$BUILD_VERSION"'-Windows.zip")' | grep -qx true
            echo "Verified that $BUILD_VERSION already has its Windows ZIP."
            exit 0
          fi
          gh release create "$BUILD_VERSION" "Touchline5-$BUILD_VERSION-Windows.zip" \
            --target "$GITHUB_SHA" --prerelease --title "Touchline 5 $BUILD_VERSION" \
            --notes "5-gegen-5-Anstoß gegen die KI im Dockpark. ZIP vollständig entpacken und Touchline5.exe starten. DualSense per USB oder Tastatur. Die Steuerung steht im Spielmenü."
